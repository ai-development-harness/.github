name: Profile CI

on:
  pull_request:
    paths:
      - "**/*.md"
      - "profile/assets/**"
      - ".markdownlint.json"
      - ".github/scripts/**"
      - ".github/workflows/profile-ci.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "profile/assets/**"
      - ".markdownlint.json"
      - ".github/scripts/**"
      - ".github/workflows/profile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Profile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate profile invariants
        run: python .github/scripts/validate_profile.py

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint.json
          globs: |
            **/*.md

  links:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            "./**/*.md"
          fail: true
          failIfEmpty: true
          jobSummary: true
